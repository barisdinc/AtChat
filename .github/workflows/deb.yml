name: Debian paketleri

# cargo-dist .deb üretmiyor. Bu iş akışı "Release" (cargo-dist) iş akışı bir
# etiket için başarıyla bitince çalışır, cargo-deb ile atchat-gui +
# atchat-channeld .deb'lerini üretip aynı GitHub Release'e ekler.
#
# Not: release:published olayı GITHUB_TOKEN ile yayınlanan sürümlerde
# tetiklenmediği için workflow_run kullanıyoruz.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiketi (ör. v0.1.0)"
        required: true

permissions:
  contents: write

defaults:
  run:
    working-directory: rust

jobs:
  deb:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Etiketi belirle
        id: tag
        working-directory: ${{ github.workspace }}
        run: echo "tag=${{ inputs.tag || github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Sistem bağımlılıkları (eframe/glow + cpal/ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxi-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo-deb kur
        run: cargo install cargo-deb --locked

      - name: .deb üret
        run: |
          cargo deb -p atchat-channeld
          cargo deb -p atchat-gui
          ls -la target/debian/

      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" target/debian/*.deb --clobber
