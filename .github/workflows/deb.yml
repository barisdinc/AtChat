name: Debian paketleri

# cargo-dist .deb üretmiyor; bu iş akışı sürüm yayınlanınca cargo-deb ile
# atchat-gui + atchat-channeld için .deb üretip aynı Release'e ekler.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Yüklenecek release etiketi (ör. v0.1.0)"
        required: false

permissions:
  contents: write

defaults:
  run:
    working-directory: rust

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Sistem bağımlılıkları (eframe/glow + cpal/ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libxi-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo-deb kur
        run: cargo install cargo-deb --locked

      - name: .deb üret
        run: |
          cargo deb -p atchat-channeld
          cargo deb -p atchat-gui
          ls -la target/debian/

      - name: Release'e yükle
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" target/debian/*.deb --clobber

      - name: Artifact olarak sakla (manuel çalıştırma)
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: rust/target/debian/*.deb
