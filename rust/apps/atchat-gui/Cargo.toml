[package]
name = "atchat-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AtCHAT egui interfaces: all-in-one, channel, client, monitor"

[package.metadata.wix]
upgrade-guid = "CFD26B3D-F1A8-47C7-AA6C-519734C08093"
path-guid = "AB82D47F-8733-4ADB-9E88-9CFDD3F85C76"
license = false
eula = false

# Ubuntu/Debian .deb (cargo-deb) — bkz. .github/workflows/deb.yml
[package.metadata.deb]
maintainer = "barisdinc <barisdinc@gmail.com>"
section = "hamradio"
priority = "optional"
depends = "$auto"
extended-description = "egui interfaces for an OFDM-based amateur-radio NET mode: channel, client (multi), monitor and all-in-one."
assets = [
    ["target/release/atchat-gui", "usr/bin/", "755"],
    ["target/release/atchat-channel", "usr/bin/", "755"],
    ["target/release/atchat-client", "usr/bin/", "755"],
    ["target/release/atchat-monitor", "usr/bin/", "755"],
    ["assets/atchat-gui.desktop", "usr/share/applications/", "644"],
]

[lib]
name = "atchat_gui"
path = "src/lib.rs"

[dependencies]
netproto.workspace = true
modem.workspace = true
channel.workspace = true
protocol.workspace = true
dsp-viz.workspace = true
anyhow.workspace = true
rand.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
cpal = "0.15"
rfd = "0.15"
