[package]
name = "atchat-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AtCHAT tek pencere GUI (egui/eframe): Kanal | İstasyonlar | Monitör"

[dependencies]
netproto.workspace = true
modem.workspace = true
channel.workspace = true
protocol.workspace = true
dsp-viz.workspace = true
anyhow.workspace = true
