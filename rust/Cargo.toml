[workspace]
resolver = "2"
members = [
    "crates/netproto",
    "crates/modem",
    "crates/channel",
    "crates/protocol",
    "crates/dsp-viz",
    "apps/atchat-channeld",
    "apps/atchat-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/barisdinc/AtChat"
authors = ["barisdinc <barisdinc@gmail.com>"]

[workspace.dependencies]
# Shared (cross-crate) dependencies. The minimum set needed for an exact port
# of modem.py / client.py / channel_server.py.
anyhow = "1"
base64 = "0.22"
crc32fast = "1.4"
num-complex = "0.4"
rustfft = "6.2"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Yerel crate'ler
netproto = { path = "crates/netproto" }
modem = { path = "crates/modem" }
channel = { path = "crates/channel" }
protocol = { path = "crates/protocol" }
dsp-viz = { path = "crates/dsp-viz" }

[profile.release]
opt-level = 3
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
